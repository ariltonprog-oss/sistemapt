<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SESMT</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .form-group-center {
            justify-content: center;
        }

        .linha-formulario-margem-top {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div id="sidebar-wrapper"></div>

    <div class="conteudo-principal">
        <header class="header-geral">
            <h1>👷‍♂️ Gerenciamento de Colaboradores (SESMT)</h1>
        </header>

        <main class="container">
            <div class="card">
                <h2 class="titulo-secao">📝 Inserir Novo Colaborador no Sistema</h2>

                <form id="formColaborador" autocomplete="off" onsubmit="return false;">

                    <div class="form-grid-edicao">
                        <!-- LINHA 1: Todos os 5 campos principais lado a lado (1 coluna para cada) -->
                        <div class="form-group form-group-1">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" required placeholder="Ex: João Silva">
                        </div>

                        <div class="form-group form-group-1">
                            <label for="matricula">Matrícula</label>
                            <input type="text" id="matricula" required placeholder="Ex: 1000857">
                        </div>

                        <div class="form-group form-group-1">
                            <label for="funcao">Função Operacional</label>
                            <select id="funcao" onchange="atualizarMatrizNRs()">
                                <option value="">Selecione...</option>
                                <option value="Mecânico">Mecânico</option>
                                <option value="Eletricista">Eletricista</option>
                                <option value="Instrumentista">Instrumentista</option>
                                <option value="Pintor Industrial">Pintor Industrial</option>
                                <option value="Caldeireiro">Caldeireiro</option>
                                <option value="Encanador Industrial">Encanador Industrial</option>
                                <option value="Soldador">Soldador</option>
                                <option value="Oficial de Construção Civil">Oficial de Construção Civil</option>
                                <option value="Operador Industrial">Operador Industrial</option>
                                <option value="Encarregado de Instrumentação & Elétrica">Encarregado de
                                    Instrumentação/Elétrica</option>
                                <option value="Encarregado de Caldeiraria & Tubulação">Encarregado de
                                    Caldeiraria/Tubulação</option>
                                <option value="Encarregado de Mecânica">Encarregado de Mecânica</option>
                                <option value="Encarregado de Civil e Pintura">Encarregado de Civil e Pintura</option>
                            </select>
                        </div>

                        <div class="form-group form-group-1">
                            <label for="ehTerceiro">Tipo de Colaborador</label>
                            <select id="ehTerceiro" onchange="alternarCampoTerceiro()">
                                <option value="false">Funcionário Próprio</option>
                                <option value="true">Colaborador Terceiro</option>
                            </select>
                        </div>

                        <div class="form-group form-group-1">
                            <label for="perfil">Perfil Operacional</label>
                            <select id="perfil" required onchange="ajustarCamposLogin()">
                                <option value="">Selecione...</option>
                                <option value="EXECUTANTE">EXECUTANTE</option>
                                <option value="OFICIAL">OFICIAL / TÉCNICO</option>
                                <option value="OPERADOR_INDUSTRIAL">OPERADOR INDUSTRIAL</option>
                                <option value="ENCARREGADO">ENCARREGADO</option>
                            </select>
                        </div>

                        <!-- LINHA SEGUINTE: Usuário, Senha, Aso, Treinamento PT, etc. -->
                        <div class="form-group form-group-1">
                            <label for="usuario">Usuário (Login)</label>
                            <input type="text" id="usuario" placeholder="Gerado ao salvar">
                        </div>

                        <div class="form-group form-group-1">
                            <label for="senha">Senha de Acesso</label>
                            <input type="text" id="senha" placeholder="Digite a senha">
                        </div>

                        <div class="form-group form-group-1">
                            <label for="realizacaoASO">Data Aso</label>
                            <input type="date" id="realizacaoASO">
                        </div>

                        <div class="form-group form-group-2">
                            <label for="realizacaoReciclagemPt">Data Treinamento PT</label>
                            <input type="date" id="realizacaoReciclagemPt">
                        </div>
                    </div>

                    <!-- Elementos de controle de largura total -->
                    <div id="containerAlcadaEmissao" class="container-alcada-emissao elemento-escondido"
                        style="margin-bottom: 20px;">
                        <input type="checkbox" id="podeEmitirPT">
                        <label for="podeEmitirPT">⚠️ Permitir que este Encarregado atue como EMITENTE de PT</label>
                    </div>

                    <!-- Seção de NRs -->
                    <div class="secao-nrs" style="margin-bottom: 25px;">
                        <h3 class="titulo-nrs" style="margin-bottom: 12px; color: var(--cor-primaria, #f59e0b);">📋
                            Requisitos Obrigatórios de Segurança</h3>
                        <div id="containerMatrizNRs">
                            <p>Selecione uma função para carregar as NRs obrigatórias...</p>
                        </div>
                    </div>

                    <!-- Botões de Ação na base do formulário -->
                    <div class="btn-group"
                        style="display: flex; gap: 12px; border-top: 1px solid var(--borda, #334155); padding-top: 20px;">
                        <button type="button" id="btnDispararSubmit" class="btn-submit"
                            style="padding: 10px 20px; cursor: pointer;">SALVAR E CERTIFICAR COLABORADOR</button>
                        <a href="admin.html" class="btn-cancelar"
                            style="padding: 10px 20px; text-decoration: none; display: inline-flex; align-items: center;">CANCELAR</a>
                    </div>
                </form>
            </div>

            <!-- Modal de Cadastro Rápido de Empresa Terceira -->
            <div id="modalNovaEmpresa" class="modal-overlay oculto">
                <div class="modal-card">
                    <h3>Cadastrar Empresa Terceirizada</h3>

                    <div class="form-group">
                        <label for="modalNomeFantasia">Nome Fantasia *</label>
                        <input type="text" id="modalNomeFantasia" placeholder="Ex: Construtora Silva"
                            class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="modalCnpj">CNPJ *</label>
                        <input type="text" id="modalCnpj" placeholder="00.000.000/0000-00" class="form-control">
                    </div>

                    <div class="modal-acoes">
                        <button type="button" class="btn-cancelar" onclick="fecharModalEmpresa()">Cancelar</button>
                        <button type="button" class="btn-salvar" onclick="salvarNovaEmpresaTerceira()">Salvar
                            Empresa</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cadastro.js"></script>
    <script src="../js/utils.js"></script>

</body>

</html>
